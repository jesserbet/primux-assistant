<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primux - AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="login-container" class="login-wrapper">
        <div class="login-box">
            <h2>Bienvenido a Primux</h2>
            <p>Inicia sesión para interactuar con tu asistente de IA</p>
            <button id="google-login-btn" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google logo">
                Continuar con Google
            </button>
        </div>
    </div>

    <div id="app-container" class="chat-container" style="display: none;">
        <header class="chat-header">
            <h1>Primux Assistant</h1>
            <button id="logout-btn" class="logout-btn">Salir</button>
        </header>
        
        <div class="character-viewer">
            <img id="character-image" src="/static/images/boca-cerrada.png" alt="Primux">
        </div>
        
        <p id="status">¡Pregúntame algo!</p>
        
        <footer class="chat-input-area">
            <div class="textarea-wrapper">
                <textarea id="text-input" placeholder="Escribe tu mensaje aquí..."></textarea>
                <button id="send-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>
    
    <script type="module" src="/static/app.js"></script>
</body>
</html>
